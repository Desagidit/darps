site_name: DARPS
site_description: Build safe, stateful LLM-powered conversations for games
site_url: https://desagidit.github.io/darps/
repo_url: https://github.com/Desagidit/darps
repo_name: DARPS
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  darps-reference.html
  darps-reference_files/
  examples/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
  # Fonts come from extra_css instead: Material's loader only fetches static
  # 300/400/700 faces, and the stylesheet uses the intermediate weights that
  # only the variable faces provide.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Desagidit/darps
      name: DARPS on GitHub

plugins:
  - search
  - glightbox:
      auto_themed: true

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Intro: index.md
  - Setup:
      - Overview: setup/index.md
      - Create a Pack: setup/first-pack.md
      - Connect a Host: setup/connect-host.md
      - Config Reference: setup/configuration.md
      - CLI Reference: setup/cli-reference.md
  - Concepts:
      - Mental Model: concepts/index.md
      - Knowledge: concepts/knowledge.md
      - Briefing: concepts/briefing.md
      - Gates: concepts/gates.md
      - State and Saves: concepts/state-saves.md
      - Glossary: concepts/glossary.md
  - Pack Authoring:
      - Overview: authoring/index.md
      - Manifest: authoring/manifest.md
      - Characters: authoring/characters.md
      - Locations: authoring/locations.md
      - Items: authoring/items.md
      - Facts and Journal: authoring/facts.md
      - When gates: authoring/when.md
      - Best Practices: authoring/best-practices.md
      - Recipes: authoring/recipes.md
      - Pack Reference: authoring/pack-specification.md
  - Host Integration:
      - Overview: integration/index.md
      - Providers: integration/providers.md
      - Streaming and Errors: integration/streaming-errors.md
  - API Reference:
      - Overview: api/index.md
      - HTTP API: api/http-reference.md
      - Python and C#: api/clients.md
  - Engine Internals:
      - Architecture: internals/architecture.md
      - Information Flow: internals/data-flow.md
      - Engine Development: internals/engine-development.md
      - States: internals/state-events.md
